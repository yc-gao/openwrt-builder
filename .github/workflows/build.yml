name: 'openwrt builder'

on:
  push:
  schedule:
    - cron: '0 0 1 * *'

env:
  REPO: https://github.com/immortalwrt/immortalwrt.git
  TAG: v25.12.2
  CLASH: https://raw.githubusercontent.com/vernesong/OpenClash/276ae9d8e7f7d9b9814ae23e015cfe29804b2cbe/master/meta/clash-linux-amd64-compatible.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        TARGET: ['x86-64']
    steps:
      # - run: |
      #     curl -L https://raw.githubusercontent.com/apache/flink/master/tools/azure-pipelines/free_disk_space.sh | bash
      - uses: actions/checkout@v3
      - name: installing deps
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev libelf-dev python3-distutils rsync unzip zlib1g-dev \
            file wget qemu-system
      - name: prepare
        run: |
          git clone --depth 1 --branch ${TAG} ${REPO} openwrt
          mkdir -p files/etc/openclash/core
          wget -qO - ${CLASH} | tar -xz -C files/etc/openclash/core
          mv files/etc/openclash/core/clash files/etc/openclash/core/clash_meta
          ln -sf $PWD/files openwrt/files

          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ${{ github.workspace }}/config/${{ matrix.TARGET }}.config ./.config
          make defconfig
      - name: compile
        uses: nick-fields/retry@v2
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        with:
          timeout_minutes: 300
          max_attempts: 3
          command: |
            cd openwrt
            make -j$(nproc) download clean world
          new_command_on_retry: |
            cd openwrt
            make -j1 V=sc download clean world
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: openwrt/bin/targets

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-package
          path: openwrt/bin/packages
