proxies:
    - name: 腾讯云
      server: **********
      port: *****
      type: ss
      cipher: chacha20-ietf-poly1305
      password: *****
    - name: wg
      type: wireguard
      server: ******
      port: ***
      ip: 10.2.0.2/32
      allowed-ips: ['0.0.0.0/0']
      private-key: *************
      public-key: *****
proxy-groups:
    - name: Proxy,
      type: select
      proxies: [腾讯云,wg]

